<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Shooter Game</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            background: #222;
            border: 2px solid #555;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        #ui {
            margin-bottom: 10px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="ui">คะแนน: <span id="score">0</span> | พลังชีวิต: <span id="hp">❤️❤️❤️</span></div>
    <canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let score = 0;
    let hp = 3;
    let isGameOver = false;

    // ตัวละครผู้เล่น (อีโมจิ 🤠)
    let player = {
        x: canvas.width / 2 - 20,
        y: canvas.height - 60,
        size: 40,
        speed: 6,
        emoji: '🤠'
    };

    let bullets = [];
    let enemies = [];
    let keys = {};

    // ควบคุมผ่านคีย์บอร์ด
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // ควบคุมผ่านหน้าจอสัมผัส (มือถือ)
    canvas.addEventListener('touchmove', e => {
        let rect = canvas.getBoundingClientRect();
        player.x = e.touches[0].clientX - rect.left - player.size / 2;
    });
    canvas.addEventListener('click', () => {
        if(!isGameOver) shoot();
    });

    function shoot() {
        bullets.push({
            x: player.x + player.size / 2 - 5,
            y: player.y,
            size: 10,
            speed: 8
        });
    }

    // สร้างศัตรู (อีโมจิ 👾)
    function spawnEnemy() {
        if (Math.random() < 0.03) {
            enemies.push({
                x: Math.random() * (canvas.width - 40),
                y: -40,
                size: 40,
                speed: 2 + Math.random() * 2,
                emoji: '👾'
            });
        }
    }

    function update() {
        if (isGameOver) return;

        // ขยับผู้เล่น
        if ((keys['ArrowLeft'] || keys['KeyA']) && player.x > 0) player.x -= player.speed;
        if ((keys['ArrowRight'] || keys['KeyD']) && player.x < canvas.width - player.size) player.x += player.speed;

        // ยิงกระสุนอัตโนมัติหรือกด Spacebar
        if (keys['Space']) {
            if (!player.cooldown) {
                shoot();
                player.cooldown = 15; // หน่วงเวลากระสุน
            }
        }
        if (player.cooldown > 0) player.cooldown--;

        // อัปเดตกระสุน
        for (let i = bullets.length - 1; i >= 0; i--) {
            bullets[i].y -= bullets[i].speed;
            if (bullets[i].y < 0) bullets.splice(i, 1);
        }

        // อัปเดตศัตรู
        spawnEnemy();
        for (let i = enemies.length - 1; i >= 0; i--) {
            enemies[i].y += enemies[i].speed;

            // ชนผู้เล่น
            if (
                enemies[i].x < player.x + player.size &&
                enemies[i].x + enemies[i].size > player.x &&
                enemies[i].y < player.y + player.size &&
                enemies[i].y + enemies[i].size > player.y
            ) {
                enemies.splice(i, 1);
                hp--;
                document.getElementById('hp').innerText = '❤️'.repeat(Math.max(0, hp));
                if (hp <= 0) isGameOver = true;
                continue;
            }

            // ชนกระสุน
            for (let j = bullets.length - 1; j >= 0; j--) {
                if (
                    bullets[j].x < enemies[i].x + enemies[i].size &&
                    bullets[j].x + bullets[j].size > enemies[i].x &&
                    bullets[j].y < enemies[i].y + enemies[i].size &&
                    bullets[j].y + bullets[j].size > enemies[i].y
                ) {
                    enemies.splice(i, 1);
                    bullets.splice(j, 1);
                    score += 10;
                    document.getElementById('score').innerText = score;
                    break;
                }
            }

            // หลุดจอ
            if (enemies[i] && enemies[i].y > canvas.height) {
                enemies.splice(i, 1);
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // วาดผู้เล่น
        ctx.font = `${player.size}px sans-serif`;
        ctx.fillText(player.emoji, player.x, player.y + player.size);

        // วาดกระสุน
        ctx.fillStyle = '#ff0';
        bullets.forEach(b => {
            ctx.fillRect(b.x, b.y, b.size, b.size);
        });

        // วาดศัตรู
        enemies.forEach(e => {
            ctx.font = `${e.size}px sans-serif`;
            ctx.fillText(e.emoji, e.x, e.y + e.size);
        });

        // จอเกมโอเวอร์
        if (isGameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.8)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            ctx.font = '30px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('เกมจบแล้ว!', canvas.width / 2, canvas.height / 2 - 20);
            ctx.font = '18px sans-serif';
            ctx.fillText('รีเฟรชหน้าเว็บเพื่อเล่นใหม่', canvas.width / 2, canvas.height / 2 + 20);
        }
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>

</body>
</html>
